# Proyecto aparte del inventario; solo comparte su red para que Caddy lo alcance por nombre.
services:
  salarios:
    build:
      context: ..
      dockerfile: servicio/Dockerfile
    image: tesis-salarios:latest
    container_name: tesis-salarios
    restart: unless-stopped
    expose:
      - "8000"
    networks:
      - homebox_default
    # El servidor tiene 3.7 GB compartidos; que esto no deje sin memoria al resto.
    mem_limit: 900m
    cpus: 1.0
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  homebox_default:
    external: true
