# Proyecto aparte del que sirve el inventario, para que el ciclo de vida de este
# servicio sea independiente. Se une a la red de aquel únicamente para que su
# Caddy pueda alcanzarlo por nombre.
services:
  salarios:
    build:
      context: ..
      dockerfile: servicio/Dockerfile
    image: tesis-salarios:latest
    container_name: tesis-salarios
    restart: unless-stopped
    expose:
      - "8000"
    networks:
      - homebox_default
    # El servidor tiene 3.7 GB compartidos. Se acota para que este servicio no
    # pueda dejar sin memoria a lo que ya estaba corriendo.
    mem_limit: 900m
    cpus: 1.0
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  homebox_default:
    external: true
