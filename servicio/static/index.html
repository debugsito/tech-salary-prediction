<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estimación salarial explicable</title>
<link rel="icon" href="data:,">
<style>
:root{
  --tinta:#1c1f23; --tinta2:#4a5058; --tinta3:#7c848e;
  --linea:#e2e5e9; --fondo:#fbfbfc; --panel:#ffffff;
  --azul:#2f5d8a; --verde:#2e7d52; --ambar:#a8720d; --rojo:#a33a32;
  --verde-f:#eaf5ee; --ambar-f:#fdf4e3; --rojo-f:#fbeceb;
}
@media (prefers-color-scheme: dark){
  :root{ --tinta:#e8eaed; --tinta2:#b3b9c1; --tinta3:#858c95;
    --linea:#2c3137; --fondo:#15181b; --panel:#1c2024;
    --azul:#7aa9d6; --verde:#6cc08d; --ambar:#dfae5a; --rojo:#e08a82;
    --verde-f:#1b2b22; --ambar-f:#2b2418; --rojo-f:#2c1d1c; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--tinta);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.envoltura{max-width:1080px;margin:0 auto;padding:28px 20px 64px}
header{border-bottom:1px solid var(--linea);padding-bottom:18px;margin-bottom:22px}
h1{font-size:21px;margin:0 0 4px;letter-spacing:-.2px}
header p{margin:0;color:var(--tinta2);font-size:13.5px;max-width:66ch}
.pestanas{display:flex;gap:4px;margin:22px 0 20px;flex-wrap:wrap}
.pestanas button{background:none;border:1px solid var(--linea);color:var(--tinta2);
  padding:8px 15px;border-radius:7px;cursor:pointer;font-size:14px;font-family:inherit}
.pestanas button[aria-selected=true]{background:var(--azul);border-color:var(--azul);color:#fff}
.rejilla{display:grid;grid-template-columns:minmax(280px,340px) 1fr;gap:22px;align-items:start}
@media(max-width:820px){.rejilla{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--linea);border-radius:10px;padding:18px}
label{display:block;font-size:12.5px;color:var(--tinta2);margin:12px 0 4px;font-weight:500}
label:first-of-type{margin-top:0}
select,input{width:100%;padding:8px 10px;border:1px solid var(--linea);border-radius:6px;
  background:var(--fondo);color:var(--tinta);font-size:14px;font-family:inherit}
select[multiple]{height:104px}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button.principal{width:100%;margin-top:18px;padding:10px;background:var(--azul);color:#fff;
  border:0;border-radius:7px;font-size:14.5px;font-weight:600;cursor:pointer;font-family:inherit}
button.principal:disabled{opacity:.5;cursor:progress}
.semaforo{border-radius:9px;padding:14px 16px;margin-bottom:16px;border:1px solid}
.semaforo.verde{background:var(--verde-f);border-color:var(--verde)}
.semaforo.ambar{background:var(--ambar-f);border-color:var(--ambar)}
.semaforo.rojo{background:var(--rojo-f);border-color:var(--rojo)}
.semaforo h3{margin:0 0 6px;font-size:14px}
.semaforo.verde h3{color:var(--verde)} .semaforo.ambar h3{color:var(--ambar)}
.semaforo.rojo h3{color:var(--rojo)}
.semaforo ul{margin:8px 0 0;padding-left:18px;font-size:13px;color:var(--tinta2)}
.semaforo li{margin:4px 0}
.cifra{font-size:34px;font-weight:650;letter-spacing:-.8px;margin:2px 0}
.rango{color:var(--tinta2);font-size:14px}
.nota{color:var(--tinta3);font-size:12.5px;margin-top:10px}
table{width:100%;border-collapse:collapse;margin-top:8px;font-size:13.5px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--linea)}
th{color:var(--tinta3);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.barra{height:8px;border-radius:4px;background:var(--azul);display:block;min-width:2px}
.barra.baja{background:var(--rojo)}
h2{font-size:15px;margin:22px 0 2px}
h2:first-child{margin-top:0}
.sub{color:var(--tinta3);font-size:12.5px;margin:0 0 10px}
.pildora{display:inline-block;padding:1px 7px;border-radius:20px;font-size:11px;
  border:1px solid var(--linea);color:var(--tinta3)}
footer{margin-top:34px;padding-top:16px;border-top:1px solid var(--linea);
  color:var(--tinta3);font-size:12px}
.vacio{color:var(--tinta3);font-size:14px;padding:30px 4px}
.aviso{color:var(--tinta3);font-size:11.5px;margin:5px 0 0;line-height:1.4}
.ejemplos{margin-top:14px;font-size:12px;color:var(--tinta3)}
.ejemplos button{background:none;border:0;color:var(--azul);cursor:pointer;
  font:inherit;text-decoration:underline;padding:0 2px}
</style>
</head>
<body>
<div class="envoltura">

<header>
  <h1>Estimación salarial explicable</h1>
  <p>Estima la compensación anual en el sector tecnológico a partir de la Stack Overflow
     Developer Survey, explica de qué depende cada estimación y <strong>declara cuándo no
     tiene datos suficientes para responder</strong>.</p>
</header>

<div class="pestanas" role="tablist">
  <button role="tab" aria-selected="true"  data-vista="candidato">Soy candidato</button>
  <button role="tab" aria-selected="false" data-vista="reclutador">Soy reclutador</button>
  <button role="tab" aria-selected="false" data-vista="comparar">Comparar mercados</button>
</div>

<div class="rejilla">
  <form class="panel" id="formulario">
    <label>País<select id="pais" required></select></label>
    <label>Rol<select id="rol"></select></label>
    <p class="aviso" id="aviso-roles"></p>
    <div class="dos">
      <label>Años profesionales<input type="number" id="anios_profesionales" min="0" max="60" step="1" value="5"></label>
      <label>Años programando<input type="number" id="anios_programando" min="0" max="60" step="1"></label>
    </div>
    <label>Nivel educativo<select id="educacion"></select></label>
    <label>Tamaño de empresa<select id="tamano_empresa"></select></label>
    <label>Modalidad<select id="modalidad"></select></label>
    <label>Sector<select id="sector"></select></label>
    <label id="fila-lenguajes">Lenguajes <span class="pildora">varios</span>
      <select id="lenguajes" multiple></select></label>
    <label id="fila-comparar" hidden>Comparar con <span class="pildora">hasta 5</span>
      <select id="comparar_paises" multiple></select></label>
    <button class="principal" type="submit" id="enviar">Estimar</button>
    <p class="ejemplos">Ejemplos:
      <button type="button" data-ej="verde">con respaldo</button> ·
      <button type="button" data-ej="ambar">con reservas</button> ·
      <button type="button" data-ej="rojo">sin respaldo</button></p>
  </form>

  <main class="panel" id="resultado">
    <div class="vacio">Completa el formulario y pulsa «Estimar».</div>
  </main>
</div>

<footer id="pie"></footer>
</div>

<script>
const $ = s => document.querySelector(s);
const dinero = n => n == null ? "—" : "$" + Math.round(n).toLocaleString("en-US");
let VISTA = "candidato", CTX = null;

function opciones(sel, items, vacio) {
  const e = $(sel); e.innerHTML = "";
  if (vacio) e.append(new Option(vacio, ""));
  for (const it of items) {
    const v = typeof it === "string" ? it : it.valor;
    const t = typeof it === "string" ? it : it.etiqueta;
    e.append(new Option(t, v));
  }
}

async function arrancar() {
  CTX = await (await fetch("/api/contexto")).json();
  const c = CTX.catalogos;
  opciones("#pais", c.Country);
  opciones("#rol", c.DevType, "Sin especificar");
  opciones("#educacion", c.EdLevel, "Sin especificar");
  opciones("#tamano_empresa", c.OrgSize, "Sin especificar");
  opciones("#modalidad", c.RemoteWork, "Sin especificar");
  opciones("#sector", c.Industry, "Sin especificar");
  opciones("#lenguajes", c.lenguajes);
  opciones("#comparar_paises", c.Country);
  const m = CTX.modelo;
  $("#pie").textContent =
    `${m.algoritmo} sobre la edición ${m.edicion} de la encuesta · ${m.n_muestra.toLocaleString("es")} `
    + `observaciones en ${m.n_paises} países · R² de ${m.r2_prueba} sobre el conjunto de prueba · `
    + `semilla ${m.semilla} · artefacto del ${m.generado}. El servicio no guarda ninguna consulta.`;
  $("#pais").value = "Germany";
  await cargarRoles();
  $("#pais").addEventListener("change", cargarRoles);
}

// El respaldo depende de la combinación de país y rol, así que el desplegable
// se rehace con cada país: ordenado por respaldo y marcando lo que no llega al
// mínimo. Sin esto el usuario tiene que adivinar qué puede consultar.
async function cargarRoles() {
  const pais = $("#pais").value;
  const sel = $("#rol");
  const previo = sel.value;
  const d = await (await fetch("/api/roles?pais=" + encodeURIComponent(pais))).json();
  sel.innerHTML = "";
  sel.append(new Option(`Sin especificar (${d.n_pais.toLocaleString("en-US")} respuestas en el país)`, ""));
  for (const r of d.roles) {
    const o = new Option(
      r.respaldado ? `${r.etiqueta} — ${r.n} respuestas`
                   : `${r.etiqueta} — solo ${r.n}, sin respaldo`, r.valor);
    if (!r.respaldado) o.style.color = "var(--tinta3)";
    sel.append(o);
  }
  if ([...sel.options].some(o => o.value === previo)) sel.value = previo;
  $("#aviso-roles").textContent = d.con_respaldo
    ? `${d.con_respaldo} de los ${d.roles.length} roles tienen al menos ${d.minimo} respuestas en este país.`
    : `Ningún rol alcanza las ${d.minimo} respuestas en este país: el sistema se abstendrá de dar una cifra.`;
}

function perfil() {
  const num = id => $(id).value === "" ? null : Number($(id).value);
  return {
    pais: $("#pais").value, rol: $("#rol").value || null,
    anios_profesionales: num("#anios_profesionales"),
    anios_programando: num("#anios_programando"),
    educacion: $("#educacion").value || null,
    tamano_empresa: $("#tamano_empresa").value || null,
    modalidad: $("#modalidad").value || null,
    sector: $("#sector").value || null,
    lenguajes: [...$("#lenguajes").selectedOptions].map(o => o.value),
  };
}

const TITULO = { verde: "Estimación respaldada", ambar: "Estimación con reservas",
                 rojo: "Sin respaldo suficiente" };

function semaforo(f) {
  const lista = f.motivos.length
    ? `<ul>${f.motivos.map(m => `<li>${m}</li>`).join("")}</ul>` : "";
  return `<div class="semaforo ${f.nivel}">
    <h3>${TITULO[f.nivel]}</h3>
    <div style="font-size:13.5px">${f.resumen}</div>${lista}</div>`;
}

function factores(lista) {
  if (!lista.length) return "";
  const max = Math.max(...lista.map(f => Math.abs(f.efecto)));
  const filas = lista.map(f => `<tr>
      <td>${f.factor}</td>
      <td style="width:46%"><span class="barra ${f.efecto < 0 ? "baja" : ""}"
          style="width:${Math.max(2, Math.abs(f.efecto) / max * 100)}%"></span></td>
      <td class="num">${f.efecto > 0 ? "+" : ""}${f.efecto.toFixed(3)}</td></tr>`).join("");
  return `<h2>De qué depende esta estimación</h2>
    <p class="sub">Cuánto separa cada bloque esta estimación de la media de la muestra.
       En positivo la empuja hacia arriba; en negativo, hacia abajo.
       <strong>Un valor cercano a cero no significa que el factor no importe</strong>,
       sino que en este perfil se parece a la media: un país de salarios medios
       aparecerá aquí con poco peso aunque la geografía sea, en el conjunto de la
       muestra, el factor que más pesa.</p>
    <table><thead><tr><th>Factor</th><th></th><th class="num">Efecto</th></tr></thead>
    <tbody>${filas}</tbody></table>`;
}

function vistaCandidato(r) {
  if (!r.banda) return semaforo(r.fiabilidad) + sinCifra(r);
  const b = r.banda;
  return semaforo(r.fiabilidad) + `
    <h2>Tu estimación</h2>
    <div class="cifra">${dinero(b.centro)}</div>
    <div class="rango">Entre ${dinero(b.inferior)} y ${dinero(b.superior)} al año,
      antes de impuestos.</div>
    <p class="nota">La amplitud no es genérica: es el error del ${(b.amplitud_relativa*100).toFixed(0)} %
      que la auditoría midió en los países del mismo nivel de renta que el tuyo.
      La mediana declarada en ${$("#pais").value} es ${dinero(r.mediana_pais)}.</p>`
    + factores(r.factores);
}

function vistaReclutador(r) {
  if (!r.banda) return semaforo(r.fiabilidad) + sinCifra(r);
  const b = r.banda;
  return semaforo(r.fiabilidad) + `
    <h2>Banda sugerida para la oferta</h2>
    <div class="cifra">${dinero(b.inferior)} – ${dinero(b.superior)}</div>
    <div class="rango">Punto medio ${dinero(b.centro)}. Mediana del mercado local
      ${dinero(r.mediana_pais)}.</div>
    <p class="nota">Publicar una banda más estrecha que esta sugeriría una precisión
      que el modelo no tiene. La justificación de abajo es la que puede darse a un
      candidato que pregunte de dónde sale la cifra.</p>`
    + factores(r.factores);
}

function sinCifra(r) {
  return `<h2>No se entrega una cifra</h2>
    <p class="sub">Devolver un número aquí daría una apariencia de precisión que los
      datos no sostienen. La mediana declarada en el país, que sí procede de
      observaciones directas, es ${dinero(r.mediana_pais)}.</p>
    <p class="nota">Prueba con un rol más frecuente en ese mercado, o compara con
      países donde la encuesta reunió más respuestas.</p>`;
}

function vistaComparar(datos) {
  const conCifra = datos.resultados.filter(r => r.banda);
  const max = conCifra.length ? Math.max(...conCifra.map(r => r.banda.superior)) : 1;
  const filas = datos.resultados.map(r => {
    const b = r.banda;
    const punto = b
      ? `<span class="barra" style="width:${b.centro / max * 100}%"></span>`
      : `<span class="pildora">sin respaldo</span>`;
    return `<tr>
      <td>${r.pais}</td>
      <td style="width:34%">${punto}</td>
      <td class="num">${b ? dinero(b.centro) : "—"}</td>
      <td class="num">${b ? dinero(b.inferior) + " – " + dinero(b.superior) : "—"}</td>
      <td><span class="semaforo ${r.fiabilidad.nivel}"
           style="padding:1px 8px;border-radius:20px;font-size:11px;display:inline-block">
           ${r.fiabilidad.nivel}</span></td></tr>`;
  }).join("");
  const validos = conCifra.map(r => r.banda.centro);
  const razon = validos.length > 1
    ? `<p class="nota">Entre el mercado mejor y el peor pagado de los comparados hay un
        factor de <strong>${(Math.max(...validos) / Math.min(...validos)).toFixed(1)} a 1</strong>
        para el mismo perfil. Ninguna otra variable del modelo produce diferencias
        de esa magnitud.</p>` : "";
  return `<h2>El mismo perfil en distintos mercados</h2>
    <p class="sub">Idéntica experiencia, rol y formación. Lo único que cambia es el país.</p>
    <table><thead><tr><th>País</th><th></th><th class="num">Estimación</th>
      <th class="num">Banda</th><th>Fiabilidad</th></tr></thead>
      <tbody>${filas}</tbody></table>${razon}`;
}

$(".pestanas").addEventListener("click", e => {
  const b = e.target.closest("button[data-vista]");
  if (!b) return;
  VISTA = b.dataset.vista;
  document.querySelectorAll(".pestanas button").forEach(x =>
    x.setAttribute("aria-selected", String(x === b)));
  $("#fila-comparar").hidden = VISTA !== "comparar";
  $("#fila-lenguajes").hidden = VISTA === "comparar";
  $("#enviar").textContent = VISTA === "comparar" ? "Comparar" : "Estimar";
  $("#resultado").innerHTML = `<div class="vacio">Completa el formulario y pulsa
    «${VISTA === "comparar" ? "Comparar" : "Estimar"}».</div>`;
});

const EJEMPLOS = {
  verde: {pais: "Germany", rol: "Developer, back-end", anios: 8},
  ambar: {pais: "Brazil", rol: "Developer, full-stack", anios: 6},
  rojo:  {pais: "Peru", rol: "Developer, back-end", anios: 8},
};

$(".ejemplos").addEventListener("click", async e => {
  const b = e.target.closest("button[data-ej]");
  if (!b) return;
  const ej = EJEMPLOS[b.dataset.ej];
  $("#pais").value = ej.pais;
  await cargarRoles();
  $("#rol").value = ej.rol;
  $("#anios_profesionales").value = ej.anios;
  $("#enviar").click();
});

$("#formulario").addEventListener("submit", async e => {
  e.preventDefault();
  const boton = $("#enviar");
  boton.disabled = true;
  const previo = boton.textContent;
  boton.textContent = "Calculando…";
  try {
    if (VISTA === "comparar") {
      const paises = [...$("#comparar_paises").selectedOptions].map(o => o.value).slice(0, 5);
      if (!paises.length) {
        $("#resultado").innerHTML = `<div class="vacio">Elige al menos un país con el
          que comparar.</div>`;
        return;
      }
      const r = await fetch("/api/comparar", {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({perfil: perfil(), paises})});
      $("#resultado").innerHTML = vistaComparar(await r.json());
    } else {
      const r = await fetch("/api/estimar", {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify(perfil())});
      const datos = await r.json();
      $("#resultado").innerHTML = VISTA === "candidato"
        ? vistaCandidato(datos) : vistaReclutador(datos);
    }
  } catch (err) {
    $("#resultado").innerHTML = `<div class="vacio">No se pudo completar la consulta.</div>`;
  } finally {
    boton.disabled = false; boton.textContent = previo;
  }
});

arrancar();
</script>
</body>
</html>
